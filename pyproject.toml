[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "decitrace"
version = "0.1.0"
description = "Local-first personal agent decision intelligence"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "DeciTrace contributors"}]
dependencies = [
  "pydantic>=2.7,<2.11",
  "tomli>=2; python_version < '3.11'",
  "eval-type-backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4"]

[project.scripts]
decitrace = "decitrace.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decitrace"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
