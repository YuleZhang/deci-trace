# Configuration example. Paths support ~ and environment variables.
data_dir = "~/.local/share/decitrace"

[sources]
codex = [
  "~/.codex/sessions",
  "~/.codex/archived_sessions",
  "~/.stepcode/codex/sessions",
]
claude = ["~/.claude/projects", "~/.stepcode/claude/projects"]
stepgo = ["~/.stepgo/sessions/host"]

[llm]
enabled = false
provider = "openai_compatible"
model = "your-model"
endpoint = "https://example.invalid/v1/chat/completions"
api_key_env = "DECITRACE_LLM_API_KEY"
timeout_seconds = 60
redact_before_send = true
